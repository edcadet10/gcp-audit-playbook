name: Validate audit work program
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    steps:
      # Official action references: https://github.com/actions/checkout and https://github.com/actions/setup-python
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Rebuild reference artifacts
        run: python tools/build.py
      - name: Verify offline behavior
        run: python tests/test_audit.py
      - name: Validate links and coverage
        run: python tools/validate.py
      - name: Check generated content is current
        run: git diff --exit-code -- controls scripts docs references templates
